<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToDo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --text: #33302c;
    --muted: #7c736b;
    --line: #ece4da;
    --line-soft: #f4efe8;
    --field: #f8f5f0;
    --accent: #a85b3f;
    --accent-soft: #f3e7e0;
    --accent-border: #e6d3c8;
    --accent-hover: #945037;
    --link: #a85b3f;
    --danger: #b4544a;
    --shadow-sm: 0 1px 2px rgba(74, 60, 47, .05);
    --shadow-md: 0 1px 2px rgba(74, 60, 47, .04), 0 10px 28px rgba(74, 60, 47, .05);
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body.no-select { user-select: none; -webkit-user-select: none; }
  body {
    margin: 0;
    padding: 40px 16px 72px;
    background: var(--bg);
    color: var(--text);
    font-family: "Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 640px; }
  .header-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
  }
  h1 { font-size: 26px; font-weight: 700; margin: 0; letter-spacing: .02em; }
  input, select, button { font: inherit; }
  .header-actions { display: flex; gap: 8px; }
  .manage-btn {
    padding: 8px 16px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); color: var(--muted); cursor: pointer; font-size: 13px;
    box-shadow: var(--shadow-sm); transition: color .15s, border-color .15s;
  }
  .manage-btn:hover { color: var(--accent); border-color: var(--accent-border); }
  .manage-panel {
    margin: 0 0 24px; padding: 6px 18px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow-md);
  }
  .manage-panel[hidden] { display: none; }
  .manage-panel .row {
    display: flex; gap: 10px; align-items: center;
    padding: 12px 0;
  }
  .manage-panel .row + .row { border-top: 1px solid var(--line-soft); }
  .manage-panel input {
    flex: 1; min-width: 0;
    padding: 6px 10px;
    border: 1px solid transparent; border-radius: 8px;
    background: none; color: var(--text); font-size: 15px;
  }
  .manage-panel input:hover { background: var(--field); }
  .manage-panel input:focus { border-color: var(--accent); background: var(--card); outline: none; }
  .manage-panel .del-project {
    border: 0; background: none; color: var(--muted);
    cursor: pointer; padding: 6px 10px; border-radius: 999px; font-size: 13px; flex-shrink: 0;
  }
  .manage-panel .del-project:disabled { opacity: .35; cursor: default; }
  #manageProjectsPanel .toggle-visibility {
    border: 1px solid var(--line); background: var(--card); color: var(--accent);
    cursor: pointer; padding: 5px 12px; border-radius: 999px; font-size: 12px; flex-shrink: 0;
  }
  #manageProjectsPanel .toggle-visibility.is-hidden { color: var(--muted); background: var(--field); }
  #manageProjectsPanel .project-color-wrap {
    display: block; width: 24px; height: 24px; border-radius: 50%;
    overflow: hidden; position: relative; flex-shrink: 0; cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(74, 60, 47, .08);
  }
  #manageProjectsPanel .project-color {
    position: absolute; top: 50%; left: 50%;
    width: 150%; height: 150%; transform: translate(-50%, -50%);
    padding: 0; border: 0; cursor: pointer; background: none;
  }
  #manageProjectsPanel .project-color::-webkit-color-swatch-wrapper { padding: 0; }
  #manageProjectsPanel .project-color::-webkit-color-swatch { border: 0; }
  #manageProjectsPanel .project-color::-moz-color-swatch { border: 0; }
  .manage-panel .del-project:hover:not(:disabled) { color: var(--danger); background: #f9eeec; }
  .manage-panel .del-project.confirm { color: #fff; background: var(--danger); }
  .manage-panel .empty { color: var(--muted); font-size: 14px; padding: 14px 0; margin: 0; }

  #filters {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px;
  }
  .chip {
    padding: 0 16px; border: 1px solid var(--line); border-radius: 999px;
    min-height: 40px; display: flex; align-items: center;
    background: var(--card); color: var(--muted); cursor: pointer; font-size: 13px;
    box-shadow: var(--shadow-sm); transition: background-color .15s, color .15s, border-color .15s;
  }
  .chip:hover { color: var(--text); }
  .chip.on {
    color: var(--accent); font-weight: 700;
    background: var(--accent-soft); border-color: var(--accent-border);
  }
  .chip-icon {
    border: 0; background: none; color: var(--muted);
    cursor: pointer; width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 11px;
  }
  .chip-icon:hover { background: var(--field); color: var(--text); }
  .chip-icon:disabled { opacity: .35; cursor: default; }
  .chip-icon:disabled:hover { background: none; color: var(--muted); }
  .chip-del:hover { color: var(--danger); background: #f9eeec; }
  .chip-del.confirm { background: var(--danger); color: #fff; }

  .theme-swatches { display: flex; flex-wrap: wrap; gap: 12px; padding: 14px 0; }
  .theme-swatch {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    border: 0; background: none; cursor: pointer; padding: 2px; font-size: 12px; color: var(--muted);
  }
  .theme-swatch .swatch-dot {
    width: 32px; height: 32px; border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(74, 60, 47, .12);
  }
  .theme-swatch.on { color: var(--text); font-weight: 700; }
  .theme-swatch.on .swatch-dot { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--accent); }

  #board { display: flex; flex-direction: column; gap: 20px; }
  .bucket {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow-md);
    padding: 18px 18px 12px;
  }
  .bucket-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin: 0 0 12px;
  }
  .bucket-head h2 { margin: 0; }
  .bucket-head-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .bucket-edit-input {
    flex: 1; min-width: 0; font: inherit; font-size: 13px; font-weight: 700; letter-spacing: .04em;
    padding: 4px 8px; border: 1px solid var(--accent); border-radius: 8px;
    background: var(--card); color: var(--text);
  }
  .bucket h2 {
    font-size: 13px; margin: 0; color: var(--muted); font-weight: 700;
    letter-spacing: .08em;
  }
  .bucket-add-card {
    display: flex; align-items: center; justify-content: center;
    border: 1px dashed var(--line); box-shadow: none; background: none;
    min-height: 64px;
  }
  .add-bucket-btn {
    border: 0; background: none; color: var(--accent); cursor: pointer;
    font: inherit; font-weight: 600; font-size: 14px; padding: 12px 16px;
  }
  .bucket-add-card .quick-add-row { width: 100%; padding: 0; }
  .bucket-list {
    list-style: none; margin: 0; padding: 0;
    min-height: 40px; border-radius: 12px; transition: background-color .12s;
  }
  .bucket-list.drag-over {
    background: var(--accent-soft);
    box-shadow: inset 0 0 0 1px var(--accent-border);
  }
  .bucket-empty {
    color: #a8a09a; font-size: 13px; padding: 12px 4px;
  }
  .quick-add-btn {
    display: block; width: 100%;
    padding: 12px 4px 8px; margin-top: 2px;
    border: 0;
    background: none; color: var(--accent); cursor: pointer; font-size: 14px; text-align: left;
    border-radius: 10px;
  }
  .quick-add-btn:hover { background: var(--field); }
  .quick-add-row {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 12px 0 6px;
  }
  .quick-add-row input {
    flex: 1 1 100%; min-width: 0;
    padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--field); color: var(--text);
  }
  .quick-add-row input:focus { border-color: var(--accent); background: var(--card); outline: none; }
  .quick-add-row input.new-project-input[hidden] {
    display: none;
  }
  .quick-add-row select {
    padding: 9px 12px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--field); color: var(--text);
  }
  .quick-add-row select:focus { border-color: var(--accent); outline: none; }
  .quick-add-row button {
    padding: 9px 18px; border: 0; border-radius: 999px; cursor: pointer; font-size: 14px;
  }
  .quick-add-confirm { background: var(--accent); color: #fff; font-weight: 500; }
  .quick-add-confirm:hover { background: var(--accent-hover); }
  .quick-add-cancel { background: none; color: var(--muted); }

  .task {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 6px;
    border-radius: 12px;
    transition: background-color .12s;
  }
  .task:hover { background: var(--field); }
  .task + .task { margin-top: 2px; }
  .task.dragging {
    opacity: .95;
    background: var(--card);
    box-shadow: 0 12px 32px rgba(74, 60, 47, .16);
  }
  .drag-handle {
    display: flex; align-items: center; justify-content: center;
    min-width: 24px; min-height: 44px; flex-shrink: 0;
    color: #c9bfb4; font-size: 16px; line-height: 1;
    cursor: grab; touch-action: none; user-select: none;
  }
  .drag-handle:active { cursor: grabbing; }
  .check-hit {
    display: flex; align-items: center; justify-content: center;
    min-width: 44px; min-height: 44px; flex-shrink: 0; cursor: pointer;
  }
  .task input[type=checkbox] { width: 19px; height: 19px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
  .label { flex: 1; min-width: 0; font-size: 15px; display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; }
  .label .proj {
    display: inline-block; flex-shrink: 0; max-width: 40%;
    padding: 4px 10px; border-radius: 8px;
    font-size: 11px; font-weight: 700; color: var(--text); letter-spacing: .02em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .label .title-text {
    flex: 1 1 auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    border-bottom: 1px dashed transparent; cursor: text;
  }
  .label .title-text:hover { border-bottom-color: #d8cec3; }
  .label .title-edit {
    flex: 1 1 auto; min-width: 80px; font: inherit;
    padding: 4px 8px; margin: -4px 0;
    border: 1px solid var(--accent); border-radius: 8px;
    background: var(--card); color: var(--text);
    touch-action: auto;
  }
  .task.done .label { color: var(--muted); text-decoration: line-through; }
  .task.done .label .proj { opacity: .45; }
  .del {
    border: 0; background: none; color: #bdb3a9;
    cursor: pointer; border-radius: 999px; flex-shrink: 0; font-size: 14px;
    min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center;
  }
  .del:hover { color: var(--danger); background: #f9eeec; }
  .del.confirm { background: var(--danger); color: #fff; font-size: 12px; }
  .bucket-tag {
    font-size: 11px; padding: 4px 10px; border-radius: 999px;
    background: var(--field); color: var(--muted); flex-shrink: 0;
    border: 1px solid var(--line);
  }

  @media (min-width: 960px) {
    main { max-width: 980px; }
    #board { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  }
</style>
</head>
<body>
<main>
  <div class="header-row">
    <h1>ToDo</h1>
    <div class="header-actions">
      <button type="button" id="manageThemeBtn" class="manage-btn">テーマ</button>
      <button type="button" id="manageProjectsBtn" class="manage-btn">プロジェクト管理</button>
    </div>
  </div>

  <div id="manageThemePanel" class="manage-panel" hidden></div>
  <div id="manageProjectsPanel" class="manage-panel" hidden></div>

  <div id="filters"></div>

  <div id="board"></div>
</main>

<script>
const KEY = 'todos.v1';
const PROJECTS_KEY = 'projects.v1';
const PROJECT_COLORS_KEY = 'projectColors.v1';
const HIDDEN_PROJECTS_KEY = 'hiddenProjects.v1';
const BUCKETS_KEY = 'buckets.v1';
const DEFAULT_BUCKETS = [
  { id: '本日中', name: '今日' },
  { id: '明日', name: '明日' },
  { id: '明日以降', name: '明日以降' },
  { id: 'お手隙', name: '時間が空いた時' },
  { id: 'Pending', name: '確認中' }
];
const COMPLETED = '完了済み';
const PROJECT_COLOR_PALETTE = [
  '#F0DCD2', '#F3E3CB', '#EFE6C8', '#DFE6D0', '#D5E3DC',
  '#D6E0E6', '#DCDCE8', '#E5DAE2', '#EDDAD8', '#E7DCCD', '#DCE2D3', '#E6E1DA'
];
const THEME_KEY = 'themeAccent.v1';
const THEME_PRESETS = [
  { id: 'terracotta', label: 'テラコッタ',
    bg: '#faf7f2', text: '#33302c', muted: '#7c736b', line: '#ece4da', lineSoft: '#f4efe8', field: '#f8f5f0',
    accent: '#a85b3f', soft: '#f3e7e0', border: '#e6d3c8', hover: '#945037' },
  { id: 'sage', label: 'セージ',
    bg: '#f6f7f1', text: '#2f332a', muted: '#767d6e', line: '#e2e6d9', lineSoft: '#eef1e6', field: '#f2f4ec',
    accent: '#6b7d5c', soft: '#e6ebe0', border: '#d3ddc8', hover: '#5a6a4c' },
  { id: 'dusty-blue', label: 'ダスティブルー',
    bg: '#f4f7f8', text: '#2b3236', muted: '#6d7a80', line: '#dde6e9', lineSoft: '#e9eff1', field: '#eef3f5',
    accent: '#4f6d82', soft: '#e2e9ed', border: '#c9d7de', hover: '#43596a' },
  { id: 'mauve', label: 'モーブ',
    bg: '#faf5f7', text: '#332b30', muted: '#7d707a', line: '#ecdfe4', lineSoft: '#f4ebee', field: '#f7eff2',
    accent: '#8a5a72', soft: '#efe1e7', border: '#ddc5cf', hover: '#764a5f' },
  { id: 'mustard', label: 'マスタード',
    bg: '#faf7ee', text: '#332e22', muted: '#7d7360', line: '#ece1c8', lineSoft: '#f4eddb', field: '#f8f2e2',
    accent: '#a9822f', soft: '#f2ead2', border: '#e3d3ac', hover: '#8f6d27' },
  { id: 'charcoal', label: 'チャコール',
    bg: '#f6f6f5', text: '#2b2a28', muted: '#75726c', line: '#e2e0dc', lineSoft: '#eeece9', field: '#f1f0ee',
    accent: '#55524c', soft: '#e9e6e0', border: '#d3cfc6', hover: '#403e39' }
];

let todos = load(KEY, []);
let projects = load(PROJECTS_KEY, []);
let projectColors = loadObject(PROJECT_COLORS_KEY, {});
let hiddenProjects = load(HIDDEN_PROJECTS_KEY, []);
let buckets = load(BUCKETS_KEY, DEFAULT_BUCKETS);
if (!buckets.length) buckets = DEFAULT_BUCKETS.slice();
let filter = 'すべて';
let quickAddBucket = null;
let dragState = null;
let pendingFocusId = null;

function uuid() {
  // crypto.randomUUID() は https / localhost 以外(secure contextでない環境)では使えないため使用しない
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

todos.forEach(t => { if (!buckets.some(b => b.id === t.bucket)) t.bucket = buckets[0].id; });

function applyTheme(id) {
  const theme = THEME_PRESETS.find(t => t.id === id) ?? THEME_PRESETS[0];
  const root = document.documentElement.style;
  root.setProperty('--bg', theme.bg);
  root.setProperty('--text', theme.text);
  root.setProperty('--muted', theme.muted);
  root.setProperty('--line', theme.line);
  root.setProperty('--line-soft', theme.lineSoft);
  root.setProperty('--field', theme.field);
  root.setProperty('--accent', theme.accent);
  root.setProperty('--accent-soft', theme.soft);
  root.setProperty('--accent-border', theme.border);
  root.setProperty('--accent-hover', theme.hover);
  root.setProperty('--link', theme.accent);
}

let themeId = THEME_PRESETS[0].id;
try {
  const stored = localStorage.getItem(THEME_KEY);
  if (stored && THEME_PRESETS.some(t => t.id === stored)) themeId = stored;
} catch {
  // localStorageが使えない環境では既定のテーマを使う
}
applyTheme(themeId);

const $board = document.getElementById('board');
const $filters = document.getElementById('filters');
const $manageProjectsBtn = document.getElementById('manageProjectsBtn');
const $manageProjectsPanel = document.getElementById('manageProjectsPanel');
const $manageThemeBtn = document.getElementById('manageThemeBtn');
const $manageThemePanel = document.getElementById('manageThemePanel');

function load(key, fallback) {
  try {
    const data = JSON.parse(localStorage.getItem(key));
    return Array.isArray(data) ? data : fallback;
  } catch {
    return fallback;
  }
}

function loadObject(key, fallback) {
  try {
    const data = JSON.parse(localStorage.getItem(key));
    return (data && typeof data === 'object' && !Array.isArray(data)) ? data : fallback;
  } catch {
    return fallback;
  }
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(todos));
    localStorage.setItem(PROJECTS_KEY, JSON.stringify(projects));
    localStorage.setItem(PROJECT_COLORS_KEY, JSON.stringify(projectColors));
    localStorage.setItem(HIDDEN_PROJECTS_KEY, JSON.stringify(hiddenProjects));
    localStorage.setItem(BUCKETS_KEY, JSON.stringify(buckets));
  } catch {
    // localStorageが使えない環境でも画面上の操作は継続できるようにする
  }
}

function assignProjectColor(name) {
  const used = new Set(Object.values(projectColors));
  let color = PROJECT_COLOR_PALETTE.find(c => !used.has(c));
  if (!color) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    color = PROJECT_COLOR_PALETTE[hash % PROJECT_COLOR_PALETTE.length];
  }
  projectColors[name] = color;
  save();
  return color;
}

function getProjectColor(name) {
  return projectColors[name] || assignProjectColor(name);
}

function setProjectColor(name, color) {
  projectColors[name] = color;
  save();
}

const NEW_PROJECT = '__new_project__';

function populateProjectOptions(selectEl, preferredValue) {
  const current = preferredValue ?? selectEl.value;
  selectEl.replaceChildren(...projects.map(p => {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p;
    return opt;
  }), Object.assign(document.createElement('option'), {
    value: NEW_PROJECT,
    textContent: '+ 新しいプロジェクト'
  }));
  if (projects.includes(current)) selectEl.value = current;
}

$manageProjectsBtn.addEventListener('click', () => {
  $manageProjectsPanel.hidden = !$manageProjectsPanel.hidden;
  if (!$manageProjectsPanel.hidden) renderManagePanel();
});

$manageThemeBtn.addEventListener('click', () => {
  $manageThemePanel.hidden = !$manageThemePanel.hidden;
  if (!$manageThemePanel.hidden) renderThemePanel();
});

function selectTheme(id) {
  themeId = id;
  try { localStorage.setItem(THEME_KEY, id); } catch {
    // localStorageが使えない環境でも見た目の切替は継続できるようにする
  }
  applyTheme(id);
  renderThemePanel();
}

function renderThemePanel() {
  const wrap = document.createElement('div');
  wrap.className = 'theme-swatches';
  wrap.append(...THEME_PRESETS.map(theme => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'theme-swatch' + (theme.id === themeId ? ' on' : '');
    const dot = document.createElement('span');
    dot.className = 'swatch-dot';
    dot.style.background = theme.accent;
    const label = document.createElement('span');
    label.textContent = theme.label;
    btn.append(dot, label);
    btn.addEventListener('click', () => selectTheme(theme.id));
    return btn;
  }));
  $manageThemePanel.replaceChildren(wrap);
}

function flashInvalid(el) {
  el.style.outline = '2px solid var(--accent)';
  setTimeout(() => { el.style.outline = ''; }, 1200);
}

function getBucketName(id) {
  return buckets.find(b => b.id === id)?.name ?? id;
}

function addBucket(name) {
  name = name.trim();
  if (!name) return false;
  buckets.push({ id: uuid(), name });
  save();
  render();
  return true;
}

function renameBucket(id, newName, input) {
  newName = newName.trim();
  const b = buckets.find(b => b.id === id);
  if (!b || !newName) return false;
  if (newName === b.name) return true;
  b.name = newName;
  save();
  render();
  return true;
}

function deleteBucket(id) {
  if (buckets.length <= 1) return;
  buckets = buckets.filter(b => b.id !== id);
  todos.forEach(t => { if (t.bucket === id) t.bucket = buckets[0].id; });
  save();
  render();
}

function renameProject(oldName, newName, input) {
  newName = newName.trim();
  if (!newName || newName === oldName) return false;
  if (projects.includes(newName)) {
    if (input) flashInvalid(input);
    return false;
  }
  projects = projects.map(p => p === oldName ? newName : p);
  todos.forEach(t => { if (t.project === oldName) t.project = newName; });
  if (projectColors[oldName]) {
    projectColors[newName] = projectColors[oldName];
    delete projectColors[oldName];
  }
  hiddenProjects = hiddenProjects.map(p => p === oldName ? newName : p);
  if (filter === oldName) filter = newName;
  save();
  render();
  renderManagePanel();
  return true;
}

function deleteProject(name) {
  projects = projects.filter(p => p !== name);
  todos = todos.filter(t => t.project !== name);
  delete projectColors[name];
  hiddenProjects = hiddenProjects.filter(p => p !== name);
  if (filter === name) filter = 'すべて';
  save();
  render();
  renderManagePanel();
}

function renderManagePanel() {
  if (!projects.length) {
    $manageProjectsPanel.replaceChildren(Object.assign(document.createElement('p'), {
      className: 'empty', textContent: 'プロジェクトがありません'
    }));
    return;
  }

  $manageProjectsPanel.replaceChildren(...projects.map(name => {
    const row = document.createElement('div');
    row.className = 'row';

    const colorWrap = document.createElement('span');
    colorWrap.className = 'project-color-wrap';

    const colorInput = document.createElement('input');
    colorInput.type = 'color';
    colorInput.className = 'project-color';
    colorInput.value = getProjectColor(name);
    colorInput.addEventListener('input', () => {
      setProjectColor(name, colorInput.value);
      render();
    });
    colorWrap.appendChild(colorInput);

    const input = document.createElement('input');
    input.value = name;
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); renameProject(name, input.value, input); }
    });
    input.addEventListener('blur', () => renameProject(name, input.value, input));

    const visBtn = document.createElement('button');
    visBtn.type = 'button';
    visBtn.className = 'toggle-visibility';
    const isHidden = hiddenProjects.includes(name);
    visBtn.textContent = isHidden ? '非表示' : '表示';
    visBtn.classList.toggle('is-hidden', isHidden);
    visBtn.addEventListener('click', () => {
      if (hiddenProjects.includes(name)) {
        hiddenProjects = hiddenProjects.filter(p => p !== name);
      } else {
        hiddenProjects.push(name);
      }
      save();
      render();
      renderManagePanel();
    });

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'del-project';
    del.textContent = '削除';
    del.addEventListener('click', () => {
      if (del.dataset.confirm) {
        deleteProject(name);
      } else {
        del.dataset.confirm = '1';
        del.classList.add('confirm');
        del.textContent = '本当に削除？';
        setTimeout(() => {
          delete del.dataset.confirm;
          del.classList.remove('confirm');
          del.textContent = '削除';
        }, 3000);
      }
    });

    row.append(colorWrap, input, visBtn, del);
    return row;
  }));
}

function renderFilters() {
  const visibleProjects = projects.filter(p => !hiddenProjects.includes(p));
  $filters.replaceChildren(...['すべて', COMPLETED, ...visibleProjects].map(name => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (filter === name ? ' on' : '');
    btn.textContent = name;
    btn.onclick = () => { filter = name; render(); };
    return btn;
  }));
}

function startEditBucketHead(head, bucket) {
  const h2 = head.querySelector('h2');
  const input = document.createElement('input');
  input.className = 'bucket-edit-input';
  input.value = bucket.name;
  input.autocomplete = 'off';
  let done = false;

  input.addEventListener('click', e => e.stopPropagation());
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (renameBucket(bucket.id, input.value, input)) done = true;
    }
    if (e.key === 'Escape') { e.preventDefault(); done = true; renderBoard(); }
  });
  input.addEventListener('blur', () => {
    if (done) return;
    if (renameBucket(bucket.id, input.value, input)) done = true;
  });

  h2.replaceWith(input);
  input.focus();
  input.select();
}

function renderAddBucketCard() {
  const section = document.createElement('section');
  section.className = 'bucket bucket-add-card';

  function renderIdle() {
    section.replaceChildren();
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'add-bucket-btn';
    btn.textContent = '+ バケットを追加';
    btn.addEventListener('click', renderAdding);
    section.appendChild(btn);
  }

  function renderAdding() {
    section.replaceChildren();
    const row = document.createElement('div');
    row.className = 'quick-add-row';

    const input = document.createElement('input');
    input.placeholder = 'バケット名';
    input.autocomplete = 'off';
    let done = false;

    function commit() {
      const name = input.value.trim();
      if (!name) { done = true; renderIdle(); return; }
      done = true;
      addBucket(name);
    }

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      if (e.key === 'Escape') { e.preventDefault(); done = true; renderIdle(); }
    });
    input.addEventListener('blur', () => { if (!done) commit(); });

    const confirmBtn = document.createElement('button');
    confirmBtn.type = 'button';
    confirmBtn.className = 'quick-add-confirm';
    confirmBtn.textContent = '追加';
    confirmBtn.addEventListener('click', () => { if (!done) commit(); });

    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'quick-add-cancel';
    cancelBtn.textContent = 'キャンセル';
    cancelBtn.addEventListener('click', () => { done = true; renderIdle(); });

    row.append(input, confirmBtn, cancelBtn);
    section.appendChild(row);
    input.focus();
  }

  renderIdle();
  return section;
}

function moveTask(id, bucket) {
  const todo = todos.find(t => t.id === id);
  if (!todo || todo.bucket === bucket) return;
  todo.bucket = bucket;
  save();
  render();
}

const DRAG_THRESHOLD = 6;

function clearDragOverHighlight() {
  document.querySelectorAll('.bucket-list.drag-over').forEach(el => el.classList.remove('drag-over'));
}

function onPointerMove(e) {
  if (!dragState || dragState.pointerId !== e.pointerId) return;
  const dx = e.clientX - dragState.startX;
  const dy = e.clientY - dragState.startY;

  if (!dragState.moved) {
    if (Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
    dragState.moved = true;
    const rect = dragState.li.getBoundingClientRect();
    dragState.origX = rect.left;
    dragState.origY = rect.top;
    dragState.li.style.width = rect.width + 'px';
    dragState.li.style.position = 'fixed';
    dragState.li.style.zIndex = 1000;
    dragState.li.style.pointerEvents = 'none';
    dragState.li.classList.add('dragging');
  }

  dragState.li.style.left = (dragState.origX + dx) + 'px';
  dragState.li.style.top = (dragState.origY + dy) + 'px';

  clearDragOverHighlight();
  const target = document.elementFromPoint(e.clientX, e.clientY)?.closest('.bucket-list');
  if (target) target.classList.add('drag-over');
}

function onPointerUp(e) {
  if (!dragState || dragState.pointerId !== e.pointerId) return;
  const { todo, li, moved } = dragState;
  dragState = null;
  document.body.classList.remove('no-select');

  if (!moved) return;

  clearDragOverHighlight();
  const target = document.elementFromPoint(e.clientX, e.clientY)?.closest('.bucket-list');

  li.classList.remove('dragging');
  li.style.position = '';
  li.style.left = '';
  li.style.top = '';
  li.style.zIndex = '';
  li.style.pointerEvents = '';
  li.style.width = '';

  if (target) moveTask(todo.id, target.dataset.bucket);
}

document.addEventListener('pointermove', onPointerMove);
document.addEventListener('pointerup', onPointerUp);
document.addEventListener('pointercancel', onPointerUp);

function renderTask(todo, { draggable = true, showBucket = false } = {}) {
  const li = document.createElement('li');
  li.className = 'task' + (todo.done ? ' done' : '');
  li.dataset.id = todo.id;

  let handle = null;
  if (draggable) {
    handle = document.createElement('span');
    handle.className = 'drag-handle';
    handle.textContent = '⠿';
    handle.setAttribute('aria-hidden', 'true');
    handle.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      dragState = { pointerId: e.pointerId, todo, li, startX: e.clientX, startY: e.clientY, moved: false };
      document.body.classList.add('no-select');
    });

    li.tabIndex = 0;
    li.setAttribute('aria-label', `${todo.project}: ${todo.title}(矢印キー上下でバケット移動)`);
    li.addEventListener('keydown', e => {
      if (e.target !== li) return;
      const idx = buckets.findIndex(b => b.id === todo.bucket);
      if (e.key === 'ArrowUp' && idx > 0) { e.preventDefault(); pendingFocusId = todo.id; moveTask(todo.id, buckets[idx - 1].id); }
      if (e.key === 'ArrowDown' && idx < buckets.length - 1) { e.preventDefault(); pendingFocusId = todo.id; moveTask(todo.id, buckets[idx + 1].id); }
    });
  }

  const check = document.createElement('input');
  check.type = 'checkbox';
  check.checked = todo.done;
  check.addEventListener('change', () => {
    todo.done = check.checked;
    save();
    render();
  });
  const checkHit = document.createElement('label');
  checkHit.className = 'check-hit';
  checkHit.addEventListener('pointerdown', e => e.stopPropagation());
  checkHit.appendChild(check);

  const label = document.createElement('span');
  label.className = 'label';
  const proj = document.createElement('span');
  proj.className = 'proj';
  proj.textContent = todo.project;
  proj.title = todo.project;
  proj.style.background = getProjectColor(todo.project);
  label.append(proj);

  const titleText = document.createElement('span');
  titleText.className = 'title-text';
  titleText.textContent = todo.title;
  titleText.title = todo.title;
  label.appendChild(titleText);

  function startEditTitle() {
    const editInput = document.createElement('input');
    editInput.className = 'title-edit';
    editInput.value = todo.title;
    editInput.autocomplete = 'off';

    editInput.addEventListener('pointerdown', e => e.stopPropagation());
    editInput.addEventListener('click', e => e.stopPropagation());

    let committed = false;
    editInput.addEventListener('blur', () => {
      if (committed) return;
      committed = true;
      const newTitle = editInput.value.trim();
      if (newTitle && newTitle !== todo.title) {
        todo.title = newTitle;
        save();
      }
      render();
    });
    editInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); editInput.blur(); }
      if (e.key === 'Escape') { e.preventDefault(); editInput.value = todo.title; editInput.blur(); }
    });

    titleText.replaceWith(editInput);
    editInput.focus();
    editInput.select();
  }

  titleText.tabIndex = 0;
  titleText.setAttribute('role', 'button');
  titleText.setAttribute('aria-label', 'タイトルを編集');
  titleText.addEventListener('pointerdown', e => e.stopPropagation());
  titleText.addEventListener('click', e => { e.stopPropagation(); startEditTitle(); });
  titleText.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startEditTitle(); }
  });

  const del = document.createElement('button');
  del.className = 'del';
  del.textContent = '✕';
  del.title = '削除';
  del.setAttribute('aria-label', '削除');
  del.addEventListener('click', () => {
    if (del.dataset.confirm) {
      todos = todos.filter(t => t.id !== todo.id);
      save();
      render();
    } else {
      del.dataset.confirm = '1';
      del.classList.add('confirm');
      del.textContent = '本当に削除？';
      setTimeout(() => {
        delete del.dataset.confirm;
        del.classList.remove('confirm');
        del.textContent = '✕';
      }, 3000);
    }
  });

  const parts = [handle, checkHit, label].filter(Boolean);
  if (showBucket) {
    const bucketTag = document.createElement('span');
    bucketTag.className = 'bucket-tag';
    bucketTag.textContent = getBucketName(todo.bucket);
    parts.push(bucketTag);
  }
  parts.push(del);
  li.append(...parts);
  return li;
}

function createProjectInline(name, select) {
  name = name.trim();
  if (!name) return false;
  if (!projects.includes(name)) {
    projects.push(name);
    save();
    renderFilters();
  }
  populateProjectOptions(select, name);
  return true;
}

function submitQuickAdd(bucket, input, select, newProjectInput, confirmNewProject) {
  const title = input.value.trim();
  if (!title) { input.focus(); return; }

  if (!newProjectInput.hidden && newProjectInput.value.trim()) {
    confirmNewProject();
    return;
  }

  if (!projects.length || select.value === NEW_PROJECT) {
    newProjectInput.hidden = false;
    flashInvalid(newProjectInput);
    newProjectInput.focus();
    return;
  }

  todos.push({ id: uuid(), title, project: select.value, bucket, done: false });
  quickAddBucket = null;
  save();
  render();
}

function renderQuickAddRow(bucket) {
  const row = document.createElement('div');
  row.className = 'quick-add-row';

  const input = document.createElement('input');
  input.placeholder = 'やることを入力';
  input.autocomplete = 'off';

  const select = document.createElement('select');
  populateProjectOptions(select, projects[0]);

  const newProjectInput = document.createElement('input');
  newProjectInput.className = 'new-project-input';
  newProjectInput.placeholder = 'プロジェクト名';
  newProjectInput.autocomplete = 'off';
  newProjectInput.hidden = projects.length > 0;

  select.addEventListener('change', () => {
    if (select.value === NEW_PROJECT) {
      newProjectInput.hidden = false;
      newProjectInput.focus();
    } else {
      newProjectInput.hidden = true;
    }
  });

  function confirmNewProject() {
    if (createProjectInline(newProjectInput.value, select)) {
      newProjectInput.value = '';
      newProjectInput.hidden = true;
      if (input.value.trim()) {
        submitQuickAdd(bucket, input, select, newProjectInput);
      } else {
        input.focus();
      }
    } else {
      newProjectInput.focus();
    }
  }

  newProjectInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); confirmNewProject(); }
    if (e.key === 'Escape') { e.preventDefault(); quickAddBucket = null; renderBoard(); }
  });
  newProjectInput.addEventListener('blur', () => {
    if (newProjectInput.value.trim()) confirmNewProject();
  });

  const confirmBtn = document.createElement('button');
  confirmBtn.type = 'button';
  confirmBtn.className = 'quick-add-confirm';
  confirmBtn.textContent = '追加';
  confirmBtn.addEventListener('click', () => submitQuickAdd(bucket, input, select, newProjectInput, confirmNewProject));

  const cancelBtn = document.createElement('button');
  cancelBtn.type = 'button';
  cancelBtn.className = 'quick-add-cancel';
  cancelBtn.textContent = 'キャンセル';
  cancelBtn.addEventListener('click', () => { quickAddBucket = null; renderBoard(); });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      // タイトル入力中のEnterでは追加せず、プロジェクトを選ばせてから確定させる
      if (projects.length && newProjectInput.hidden && input.value.trim()) {
        select.focus();
      } else {
        submitQuickAdd(bucket, input, select, newProjectInput, confirmNewProject);
      }
    }
    if (e.key === 'Escape') { quickAddBucket = null; renderBoard(); }
  });

  select.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); submitQuickAdd(bucket, input, select, newProjectInput, confirmNewProject); }
    if (e.key === 'Escape') { e.preventDefault(); quickAddBucket = null; renderBoard(); }
  });

  row.append(input, select, newProjectInput, confirmBtn, cancelBtn);
  return row;
}

function renderQuickAddButton(bucket) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'quick-add-btn';
  btn.textContent = '+ 新規追加';
  btn.addEventListener('click', () => { quickAddBucket = bucket; renderBoard(); });
  return btn;
}

function renderCompletedBoard() {
  const doneTasks = todos.filter(t => t.done);

  const section = document.createElement('section');
  section.className = 'bucket';

  const h2 = document.createElement('h2');
  h2.textContent = `＜${COMPLETED}＞`;
  section.appendChild(h2);

  const ul = document.createElement('ul');
  ul.className = 'bucket-list';

  if (!doneTasks.length) {
    const empty = document.createElement('li');
    empty.className = 'bucket-empty';
    empty.textContent = '完了済みのタスクはありません';
    ul.appendChild(empty);
  } else {
    doneTasks.forEach(todo => ul.appendChild(renderTask(todo, { draggable: false, showBucket: true })));
  }

  section.appendChild(ul);
  $board.replaceChildren(section);
}

function renderBoard() {
  if (filter === COMPLETED) {
    renderCompletedBoard();
    return;
  }

  const base = filter === 'すべて' ? todos : todos.filter(t => t.project === filter);
  const filtered = base.filter(t => !t.done);

  $board.replaceChildren(...buckets.map(bucket => {
    const section = document.createElement('section');
    section.className = 'bucket';

    const head = document.createElement('div');
    head.className = 'bucket-head';

    const h2 = document.createElement('h2');
    h2.textContent = `＜${bucket.name}＞`;
    head.appendChild(h2);

    const actions = document.createElement('div');
    actions.className = 'bucket-head-actions';

    const editBtn = document.createElement('button');
    editBtn.type = 'button';
    editBtn.className = 'chip-icon';
    editBtn.textContent = '✎';
    editBtn.setAttribute('aria-label', 'バケット名を編集');
    editBtn.addEventListener('click', () => startEditBucketHead(head, bucket));
    actions.appendChild(editBtn);

    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'chip-icon chip-del';
    delBtn.textContent = '✕';
    delBtn.setAttribute('aria-label', 'バケットを削除');
    delBtn.disabled = buckets.length <= 1;
    delBtn.title = delBtn.disabled ? 'バケットは最低1つ必要です' : '削除';
    delBtn.addEventListener('click', () => {
      if (delBtn.dataset.confirm) {
        deleteBucket(bucket.id);
      } else {
        delBtn.dataset.confirm = '1';
        delBtn.classList.add('confirm');
        delBtn.title = 'もう一度クリックで削除';
        setTimeout(() => {
          delete delBtn.dataset.confirm;
          delBtn.classList.remove('confirm');
          delBtn.title = buckets.length <= 1 ? 'バケットは最低1つ必要です' : '削除';
        }, 3000);
      }
    });
    actions.appendChild(delBtn);

    head.appendChild(actions);
    section.appendChild(head);

    const ul = document.createElement('ul');
    ul.className = 'bucket-list';
    ul.dataset.bucket = bucket.id;

    const items = filtered.filter(t => t.bucket === bucket.id);
    if (!items.length) {
      if (filter === 'すべて') {
        const empty = document.createElement('li');
        empty.className = 'bucket-empty';
        empty.textContent = 'タスクなし';
        ul.appendChild(empty);
      }
    } else {
      items.forEach(todo => ul.appendChild(renderTask(todo)));
    }

    section.appendChild(ul);
    section.appendChild(
      quickAddBucket === bucket.id ? renderQuickAddRow(bucket.id) : renderQuickAddButton(bucket.id)
    );
    return section;
  }), renderAddBucketCard());

  $board.querySelector('.quick-add-row input')?.focus();

  if (pendingFocusId) {
    $board.querySelector(`[data-id="${pendingFocusId}"]`)?.focus();
    pendingFocusId = null;
  }
}

function render() {
  if (filter !== 'すべて' && filter !== COMPLETED && (!projects.includes(filter) || hiddenProjects.includes(filter))) filter = 'すべて';
  renderFilters();
  renderBoard();
}

render();
</script>
</body>
